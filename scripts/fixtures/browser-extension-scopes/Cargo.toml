[package]
name = "browser-extension-scopes-probe"
version = "0.1.0"
edition = "2021"
# 保持原扩展测试命令默认入口，主题回归通过 --bin 选择。
default-run = "browser-extension-scopes-probe"

[dependencies]
tauri = { version = "2.12.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
webview2-com = "0.39"
base64 = "0.22"
windows = { version = "0.62", features = ["Win32_System_StationsAndDesktops", "Win32_Security"] }

[build-dependencies]
tauri-build = "2.7.4"

[[bin]]
name = "browser-theme-probe"
path = "src/theme_probe.rs"

[[bin]]
name = "browser-resize-probe"
path = "src/resize_probe.rs"

[[bin]]
name = "browser-favicon-probe"
path = "src/favicon_probe.rs"

[[bin]]
name = "browser-popup-order-probe"
path = "src/popup_order_probe.rs"
