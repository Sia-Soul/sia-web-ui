[package]
name = "browser-extension-scopes-probe"
version = "0.1.0"
edition = "2021"
# 保持原扩展测试命令默认入口，主题回归通过 --bin 选择。
default-run = "browser-extension-scopes-probe"

[dependencies]
tauri = { version = "2.12.5", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
webview2-com = "0.39"
base64 = "0.22"
# Accessibility 用于真实工具窗口的创建事件监听，覆盖准备期间的透明显示流程。
windows = { version = "0.62", features = ["Win32_System_StationsAndDesktops", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_Accessibility"] }

[build-dependencies]
tauri-build = "2.7.4"

[[bin]]
name = "browser-theme-probe"
path = "src/theme_probe.rs"

[[bin]]
name = "browser-resize-probe"
path = "src/resize_probe.rs"

[[bin]]
name = "browser-favicon-probe"
path = "src/favicon_probe.rs"

[[bin]]
name = "browser-popup-order-probe"
path = "src/popup_order_probe.rs"

# 真实 WebView2 停靠回归，使用独立临时资料目录。
[[bin]]
name = "browser-devtools-probe"
path = "src/devtools_probe.rs"
