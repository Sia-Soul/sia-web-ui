[package]
# 二进制使用英文品牌名，确保 Windows 进程显示为 sia-browser.exe。
name = "sia-browser"
version = "0.1.0"
description = "Sia Browser - a lightweight workspace browser powered by Sia WebUI"
authors = ["Sia UI"]
edition = "2021"

[lib]
name = "sia_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 只读查询 Firefox 收藏夹，使用自带 SQLite 避免依赖用户安装的数据库组件。
rusqlite = { version = "0.32", features = ["bundled"] }
# 2.12 使用修复 Windows 键盘/焦点消息重入死锁的 Tao 0.37；锁文件固定实际构建版本。
tauri = { version = "2.12.5", features = ["unstable", "devtools"] }
# 启动屏障异步等待；扩展 COM 回调同时使用超时保护。
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
# 网页内核提供的 PNG 图标转为数据地址，避免外壳跨 Profile 再请求图标。
base64 = "0.22"
# 系统文件图标编码为透明 PNG，供下载面板直接显示。
png = "0.18"
rfd = "0.15"
# 当前用户默认应用登记，沿用工作区记事本使用的注册表封装。
winreg = "0.55"
# 与 Tauri 的原生 WebView2 接口使用同代 Windows 类型，避免跨版本 COM 类型不兼容。
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Security_Cryptography",
  # 安装器通过命名互斥体检测运行中的浏览器，避免覆盖或卸载正在使用的程序。
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # 在工具窗口创建/显示事件到达时立即遮蔽，避免先出现独立窗口再停靠。
  "Win32_UI_Accessibility",
  # 停靠前核对 DPI 模式，避免跨进程 SetParent 导致缩放状态重置。
  "Win32_UI_HiDpi",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# 系统再次打开链接或 HTML 文件时，将参数转交给现有浏览器窗口。
tauri-plugin-single-instance = "2"
